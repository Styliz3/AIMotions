<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2 Pro Tracker - Advanced Stats & Ranking</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0e27;
            color: #fff;
            min-height: 100vh;
        }
        .navbar {
            background: rgba(15, 20, 40, 0.95);
            backdrop-filter: blur(10px);
            padding: 15px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px;
        }
        .hero {
            text-align: center;
            padding: 60px 0 40px;
        }
        .hero h1 {
            font-size: 3.5em;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.2em;
        }
        .search-section {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .search-box {
            display: flex;
            gap: 15px;
            max-width: 800px;
            margin: 0 auto 20px;
        }
        input {
            flex: 1;
            padding: 18px 24px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 16px;
            transition: all 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
            background: rgba(255, 255, 255, 0.08);
        }
        input::placeholder { color: rgba(255, 255, 255, 0.4); }
        button {
            padding: 18px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4); }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .error, .info {
            padding: 15px 20px;
            border-radius: 12px;
            margin-top: 20px;
            text-align: center;
        }
        .error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }
        .info {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #93c5fd;
        }
        .loading {
            text-align: center;
            padding: 60px 20px;
            font-size: 18px;
            color: rgba(255, 255, 255, 0.6);
        }
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .profile-overview {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 30px;
        }
        .profile-avatar {
            width: 120px;
            height: 120px;
            border-radius: 20px;
            border: 3px solid #667eea;
            flex-shrink: 0;
        }
        .profile-info {
            flex: 1;
        }
        .profile-name {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .profile-link {
            color: #667eea;
            text-decoration: none;
            font-size: 0.9em;
        }
        .profile-link:hover { text-decoration: underline; }
        .rank-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            flex-shrink: 0;
            min-width: 200px;
        }
        .rank-badge .rank-number {
            font-size: 3em;
            font-weight: 700;
            margin-bottom: 5px;
        }
        .rank-badge .rank-label {
            font-size: 0.9em;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .rank-badge .rank-name {
            font-size: 1.2em;
            font-weight: 600;
            margin-top: 10px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s;
        }
        .stat-card:hover {
            transform: translateY(-5px);
            border-color: rgba(102, 126, 234, 0.5);
        }
        .stat-card h3 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.1em;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .stat-item:last-child { border-bottom: none; }
        .stat-label { color: rgba(255, 255, 255, 0.6); }
        .stat-value {
            font-weight: 600;
            color: #fff;
            font-size: 1.1em;
        }
        .matches-section {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .matches-section h2 {
            margin-bottom: 25px;
            font-size: 1.8em;
        }
        .match-card {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s;
        }
        .match-card:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(102, 126, 234, 0.3);
        }
        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .match-result {
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9em;
        }
        .match-result.win {
            background: rgba(34, 197, 94, 0.2);
            color: #86efac;
        }
        .match-result.loss {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
        }
        .match-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }
        .match-stat {
            text-align: center;
        }
        .match-stat-label {
            font-size: 0.8em;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 5px;
        }
        .match-stat-value {
            font-size: 1.3em;
            font-weight: 600;
        }
        .tracking-status {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            padding: 15px 20px;
            border-radius: 12px;
            margin-top: 20px;
            text-align: center;
            color: #86efac;
        }
        @media (max-width: 768px) {
            .hero h1 { font-size: 2em; }
            .search-box { flex-direction: column; }
            .profile-overview { flex-direction: column; text-align: center; }
            .rank-badge { min-width: 100%; }
            .stats-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">🎯 CS2 Pro Tracker</div>
            <div style="color: rgba(255,255,255,0.6); font-size: 0.9em;">Advanced Stats & Ranking System</div>
        </div>
    </nav>

    <div class="container">
        <div class="hero">
            <h1>Track Your CS2 Performance</h1>
            <p>Advanced statistics, match history, and custom ranking system</p>
        </div>

        <div class="search-section">
            <div class="search-box">
                <input type="text" id="steamInput" placeholder="Enter Steam Profile URL or ID (e.g., https://steamcommunity.com/id/username)">
                <button onclick="trackPlayer()">Start Tracking</button>
            </div>
            <div id="message"></div>
        </div>

        <div id="loading" style="display: none;" class="loading">
            <div class="spinner"></div>
            Loading player data and calculating rank...
        </div>

        <div id="results"></div>
    </div>

    <script>
        let trackingInterval = null;

        async function trackPlayer() {
            const input = document.getElementById('steamInput').value.trim();
            const messageDiv = document.getElementById('message');
            const loadingDiv = document.getElementById('loading');
            const resultsDiv = document.getElementById('results');

            messageDiv.innerHTML = '';
            resultsDiv.innerHTML = '';

            if (!input) {
                messageDiv.innerHTML = '<div class="error">Please enter a Steam profile URL or ID</div>';
                return;
            }

            loadingDiv.style.display = 'block';

            try {
                const response = await fetch('/api/track', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ steamInput: input })
                });

                const data = await response.json();
                loadingDiv.style.display = 'none';

                if (!response.ok) {
                    messageDiv.innerHTML = `<div class="error">${data.error || 'Failed to track player'}</div>`;
                    return;
                }

                displayPlayerData(data);
                
                // Save to localStorage for persistence
                localStorage.setItem('trackedPlayer', JSON.stringify({
                    steamId: data.steamId,
                    input: input,
                    timestamp: Date.now()
                }));

                // Start auto-refresh
                startTracking(input);

            } catch (error) {
                loadingDiv.style.display = 'none';
                messageDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }

        function startTracking(input) {
            if (trackingInterval) clearInterval(trackingInterval);
            
            // Refresh every 5 minutes
            trackingInterval = setInterval(() => {
                refreshStats(input);
            }, 5 * 60 * 1000);
        }

        async function refreshStats(input) {
            try {
                const response = await fetch('/api/track', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ steamInput: input })
                });

                if (response.ok) {
                    const data = await response.json();
                    displayPlayerData(data);
                }
            } catch (error) {
                console.error('Failed to refresh stats:', error);
            }
        }

        function displayPlayerData(data) {
            const { profile, stats, rank, matches } = data;
            const resultsDiv = document.getElementById('results');

            resultsDiv.innerHTML = `
                <div class="profile-overview">
                    <img src="${profile.avatarfull}" alt="Avatar" class="profile-avatar">
                    <div class="profile-info">
                        <div class="profile-name">${profile.personaname}</div>
                        <a href="${profile.profileurl}" target="_blank" class="profile-link">View Steam Profile →</a>
                        <div style="margin-top: 10px; color: rgba(255,255,255,0.6);">
                            Member since ${new Date(profile.timecreated * 1000).toLocaleDateString()}
                        </div>
                    </div>
                    <div class="rank-badge">
                        <div class="rank-number">${rank.rating}</div>
                        <div class="rank-label">Rating</div>
                        <div class="rank-name">${rank.tier}</div>
                    </div>
                </div>

                <div class="stats-grid">
                    <div class="stat-card">
                        <h3>🎯 Combat Stats</h3>
                        <div class="stat-item">
                            <span class="stat-label">Total Kills</span>
                            <span class="stat-value">${stats.total_kills}</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Total Deaths</span>
                            <span class="stat-value">${stats.total_deaths}</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">K/D Ratio</span>
                            <span class="stat-value">${stats.kd_ratio}</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Headshot %</span>
                            <span class="stat-value">${stats.headshot_percentage}</span>
                        </div>
                    </div>

                    <div class="stat-card">
                        <h3>🏆 Win Stats</h3>
                        <div class="stat-item">
                            <span class="stat-label">Total Wins</span>
                            <span class="stat-value">${stats.total_wins}</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Win Rate</span>
                            <span class="stat-value">${stats.win_rate}</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">MVPs</span>
                            <span class="stat-value">${stats.mvps || 'N/A'}</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Total Playtime</span>
                            <span class="stat-value">${stats.playtime} hrs</span>
                        </div>
                    </div>

                    <div class="stat-card">
                        <h3>📊 Performance</h3>
                        <div class="stat-item">
                            <span class="stat-label">Accuracy</span>
                            <span class="stat-value">${stats.accuracy}</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Damage Per Round</span>
                            <span class="stat-value">${stats.damage_per_round || 'N/A'}</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Clutch Success</span>
                            <span class="stat-value">${stats.clutch_rate || 'N/A'}</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">First Kill Rate</span>
                            <span class="stat-value">${stats.first_kill_rate || 'N/A'}</span>
                        </div>
                    </div>
                </div>

                <div class="matches-section">
                    <h2>📈 Recent Activity</h2>
                    ${matches && matches.length > 0 ? matches.map(match => `
                        <div class="match-card">
                            <div class="match-header">
                                <div>
                                    <div style="font-size: 1.1em; font-weight: 600; margin-bottom: 5px;">${match.map || 'Unknown Map'}</div>
                                    <div style="font-size: 0.85em; color: rgba(255,255,255,0.5);">${match.date}</div>
                                </div>
                                <div class="match-result ${match.result}">${match.result.toUpperCase()}</div>
                            </div>
                            <div class="match-stats">
                                <div class="match-stat">
                                    <div class="match-stat-label">K/D</div>
                                    <div class="match-stat-value">${match.kills}/${match.deaths}</div>
                                </div>
                                <div class="match-stat">
                                    <div class="match-stat-label">Score</div>
                                    <div class="match-stat-value">${match.score}</div>
                                </div>
                                <div class="match-stat">
                                    <div class="match-stat-label">MVPs</div>
                                    <div class="match-stat-value">${match.mvps || 0}</div>
                                </div>
                                <div class="match-stat">
                                    <div class="match-stat-label">HS%</div>
                                    <div class="match-stat-value">${match.headshot_percentage || '0%'}</div>
                                </div>
                            </div>
                        </div>
                    `).join('') : '<div class="info">Match history will appear here as you play. Stats update every 5 minutes.</div>'}
                    
                    <div class="tracking-status">
                        ✓ Player is being tracked • Auto-updating every 5 minutes
                    </div>
                </div>
            `;
        }

        // Load previously tracked player on page load
        window.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('trackedPlayer');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    // Only auto-load if tracked within last hour
                    if (Date.now() - data.timestamp < 60 * 60 * 1000) {
                        document.getElementById('steamInput').value = data.input;
                        trackPlayer();
                    }
                } catch (e) {
                    console.error('Failed to load saved player:', e);
                }
            }
        });

        // Enter key support
        document.getElementById('steamInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') trackPlayer();
        });
    </script>
</body>
</html>
