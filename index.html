<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Motion Graphics Studio Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #fff;
            background-image: 
                linear-gradient(rgba(0,0,0,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,0,0,0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            max-width: 1400px;
            width: 100%;
            padding: 40px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 42px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 16px;
        }

        .badge {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 8px;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .input-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            resize: vertical;
            min-height: 120px;
            font-family: inherit;
            transition: all 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        select {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
        }

        select:focus {
            outline: none;
            border-color: #667eea;
        }

        .generate-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .generate-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .preview-section {
            background: #f5f5f5;
            border-radius: 16px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 500px;
        }

        #canvas {
            max-width: 100%;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            background: white;
        }

        .status {
            margin-top: 20px;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            display: none;
        }

        .status.loading {
            background: #fef3c7;
            color: #92400e;
            display: block;
        }

        .status.success {
            background: #d1fae5;
            color: #065f46;
            display: block;
        }

        .status.error {
            background: #fee2e2;
            color: #991b1b;
            display: block;
        }

        .export-section {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }

        .export-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: none;
        }

        .export-btn:hover {
            background: #059669;
        }

        .export-btn.visible {
            display: inline-block;
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
            display: none;
        }

        .loader.active {
            display: block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .examples {
            margin-top: 20px;
            padding: 20px;
            background: #f9fafb;
            border-radius: 12px;
        }

        .examples h3 {
            font-size: 14px;
            color: #666;
            margin-bottom: 12px;
        }

        .example-chip {
            display: inline-block;
            padding: 8px 16px;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 20px;
            font-size: 13px;
            margin: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .example-chip:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
            padding: 20px;
            background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
            border-radius: 12px;
        }

        .feature-item {
            text-align: center;
            padding: 15px;
        }

        .feature-item i {
            font-size: 32px;
            color: #667eea;
            margin-bottom: 8px;
        }

        .feature-item h4 {
            font-size: 13px;
            color: #333;
            font-weight: 600;
        }

        @media (max-width: 968px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>AI Motion Graphics Studio <span class="badge">PRO</span></h1>
            <p class="subtitle">Create professional motion graphics with AI - Icons, Arrows, Effects & More!</p>
        </header>

        <div class="features">
            <div class="feature-item">
                <i class="fas fa-icons"></i>
                <h4>Font Awesome Icons</h4>
            </div>
            <div class="feature-item">
                <i class="fas fa-arrow-right"></i>
                <h4>Smooth Arrows</h4>
            </div>
            <div class="feature-item">
                <i class="fas fa-sparkles"></i>
                <h4>Particle Effects</h4>
            </div>
            <div class="feature-item">
                <i class="fas fa-layer-group"></i>
                <h4>Multi-Layer</h4>
            </div>
        </div>

        <div class="main-grid">
            <div class="input-section">
                <div class="input-group">
                    <label for="prompt">Describe your motion graphic</label>
                    <textarea 
                        id="prompt" 
                        placeholder="E.g., Dark grid background with pink arrow moving from left to right, gear icon rotating in center, text 'Data Processing' fading in below with particle effects"
                    ></textarea>
                </div>

                <div class="input-group">
                    <label for="duration">Duration (seconds)</label>
                    <select id="duration">
                        <option value="3">3 seconds</option>
                        <option value="5" selected>5 seconds</option>
                        <option value="8">8 seconds</option>
                        <option value="10">10 seconds</option>
                        <option value="15">15 seconds</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="resolution">Resolution</label>
                    <select id="resolution">
                        <option value="1920x1080" selected>1080p (1920x1080)</option>
                        <option value="1080x1920">9:16 Vertical (1080x1920)</option>
                        <option value="1080x1080">Square (1080x1080)</option>
                        <option value="1280x720">720p (1280x720)</option>
                    </select>
                </div>

                <button class="generate-btn" id="generateBtn">✨ Generate Motion Graphic</button>

                <div class="examples">
                    <h3>🎨 Quick Examples:</h3>
                    <span class="example-chip" data-prompt="Purple grid background, arrow moving from left to right, gear icon rotating in center, text 'Training' below">Data → Training → AI</span>
                    <span class="example-chip" data-prompt="Dark background with animated counter from 0 to 100 with particle effects and glowing text">Counter with Particles</span>
                    <span class="example-chip" data-prompt="Gradient background pink to purple, heart icon pulsing in center, text 'Subscribe' bouncing below">Subscribe Animation</span>
                    <span class="example-chip" data-prompt="Transparent background, checkmark icon drawing in with green color, text 'Success!' sliding from right">Success Checkmark</span>
                    <span class="example-chip" data-prompt="Grid background blue lines, rocket icon launching from bottom to top, stars appearing around">Rocket Launch</span>
                </div>
            </div>

            <div class="preview-section">
                <canvas id="canvas" width="1920" height="1080"></canvas>
                <div class="loader" id="loader"></div>
                <div class="status" id="status"></div>
                <div class="export-section">
                    <button class="export-btn" id="exportBtn">💾 Download Frames</button>
                    <button class="export-btn" id="replayBtn">🔄 Replay</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const promptInput = document.getElementById('prompt');
        const generateBtn = document.getElementById('generateBtn');
        const durationSelect = document.getElementById('duration');
        const resolutionSelect = document.getElementById('resolution');
        const status = document.getElementById('status');
        const loader = document.getElementById('loader');
        const exportBtn = document.getElementById('exportBtn');
        const replayBtn = document.getElementById('replayBtn');

        let currentAnimation = null;
        let animationFrames = [];

        // Icon cache
        const iconCache = {};

        // Font Awesome icons mapping
        const fontAwesomeIcons = {
            'heart': '\uf004',
            'star': '\uf005',
            'gear': '\uf013',
            'cog': '\uf013',
            'check': '\uf00c',
            'checkmark': '\uf00c',
            'times': '\uf00d',
            'arrow-right': '\uf061',
            'arrow-left': '\uf060',
            'arrow-up': '\uf062',
            'arrow-down': '\uf063',
            'rocket': '\uf135',
            'lightning': '\uf0e7',
            'bolt': '\uf0e7',
            'cloud': '\uf0c2',
            'bell': '\uf0f3',
            'trophy': '\uf091',
            'fire': '\uf06d',
            'chart': '\uf080',
            'brain': '\uf5dc',
            'sparkles': '\uf890',
            'circle': '\uf111',
            'square': '\uf0c8',
            'play': '\uf04b',
            'pause': '\uf04c',
            'download': '\uf019'
        };

        // Example chips
        document.querySelectorAll('.example-chip').forEach(chip => {
            chip.addEventListener('click', () => {
                promptInput.value = chip.dataset.prompt;
            });
        });

        // Set canvas resolution
        resolutionSelect.addEventListener('change', () => {
            const [w, h] = resolutionSelect.value.split('x').map(Number);
            canvas.width = w;
            canvas.height = h;
        });

        generateBtn.addEventListener('click', generateMotionGraphic);
        replayBtn.addEventListener('click', replayAnimation);

        async function generateMotionGraphic() {
            const prompt = promptInput.value.trim();
            if (!prompt) {
                showStatus('Please enter a description', 'error');
                return;
            }

            generateBtn.disabled = true;
            loader.classList.add('active');
            showStatus('AI is analyzing your request...', 'loading');
            exportBtn.classList.remove('visible');
            replayBtn.classList.remove('visible');
            animationFrames = [];

            try {
                // Call Groq API through Cloudflare Worker
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        prompt,
                        duration: parseInt(durationSelect.value),
                        resolution: resolutionSelect.value
                    })
                });

                if (!response.ok) throw new Error('Failed to generate');

                const data = await response.json();
                currentAnimation = data.animation;

                showStatus('Rendering motion graphic with effects...', 'loading');
                await renderAnimation(currentAnimation);
                
                showStatus('✨ Motion graphic ready!', 'success');
                exportBtn.classList.add('visible');
                replayBtn.classList.add('visible');

            } catch (error) {
                showStatus('Error: ' + error.message, 'error');
                console.error(error);
            } finally {
                generateBtn.disabled = false;
                loader.classList.remove('active');
            }
        }

        async function renderAnimation(anim) {
            const fps = 30;
            const totalFrames = anim.duration * fps;
            const [w, h] = resolutionSelect.value.split('x').map(Number);

            for (let frame = 0; frame <= totalFrames; frame++) {
                const progress = frame / totalFrames;
                
                // Clear canvas
                ctx.clearRect(0, 0, w, h);

                // Render background
                renderBackground(anim.background, w, h, progress);

                // Render elements
                if (anim.elements) {
                    for (const el of anim.elements) {
                        await renderElement(el, w, h, progress, frame);
                    }
                }

                // Store frame for export
                animationFrames.push(canvas.toDataURL());

                // Small delay for visual feedback
                if (frame % 3 === 0) {
                    await new Promise(resolve => setTimeout(resolve, 1));
                }
            }
        }

        function renderBackground(bg, w, h, progress) {
            if (bg.type === 'transparent') {
                // Draw checkerboard pattern for transparency
                const size = 20;
                for (let y = 0; y < h; y += size) {
                    for (let x = 0; x < w; x += size) {
                        ctx.fillStyle = ((x / size) + (y / size)) % 2 === 0 ? '#fff' : '#e5e5e5';
                        ctx.fillRect(x, y, size, size);
                    }
                }
            } else if (bg.type === 'solid') {
                ctx.fillStyle = bg.color;
                ctx.fillRect(0, 0, w, h);
            } else if (bg.type === 'gradient') {
                const gradient = ctx.createLinearGradient(0, 0, w, h);
                gradient.addColorStop(0, bg.color1);
                gradient.addColorStop(1, bg.color2);
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, w, h);
            } else if (bg.type === 'grid') {
                ctx.fillStyle = bg.bgColor || '#1a1a2e';
                ctx.fillRect(0, 0, w, h);
                
                ctx.strokeStyle = bg.lineColor || '#0ea5e9';
                ctx.lineWidth = bg.lineWidth || 2;
                const spacing = bg.spacing || 50;
                
                // Animated grid effect
                const offset = (progress * spacing) % spacing;
                
                for (let x = -spacing + offset; x < w; x += spacing) {
                    ctx.globalAlpha = 0.3 + Math.sin(progress * Math.PI * 2) * 0.2;
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, h);
                    ctx.stroke();
                }
                for (let y = -spacing + offset; y < h; y += spacing) {
                    ctx.globalAlpha = 0.3 + Math.sin(progress * Math.PI * 2) * 0.2;
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(w, y);
                    ctx.stroke();
                }
                ctx.globalAlpha = 1;
            }
        }

        async function renderElement(el, w, h, progress, frame) {
            const animProgress = Math.max(0, Math.min(1, 
                (progress - el.startTime) / (el.endTime - el.startTime)
            ));

            if (animProgress <= 0 || animProgress > 1) return;

            ctx.save();

            // Calculate animation effects
            const effects = calculateAnimation(el.animation, animProgress, w, h);

            ctx.globalAlpha = effects.opacity;

            if (el.type === 'text') {
                ctx.font = `${el.fontSize * effects.scale}px ${el.fontFamily || 'Arial'}`;
                ctx.fillStyle = el.color;
                ctx.textAlign = el.align || 'center';
                ctx.textBaseline = 'middle';
                
                const x = (el.x / 100) * w + effects.offsetX;
                const y = (el.y / 100) * h + effects.offsetY;
                
                if (el.glow) {
                    ctx.shadowColor = el.color;
                    ctx.shadowBlur = 20;
                }
                
                if (el.shadow) {
                    ctx.shadowColor = 'rgba(0,0,0,0.5)';
                    ctx.shadowBlur = 10;
                    ctx.shadowOffsetX = 5;
                    ctx.shadowOffsetY = 5;
                }
                
                ctx.fillText(el.text, x, y);
            } 
            else if (el.type === 'counter') {
                const currentValue = Math.floor(el.from + (el.to - el.from) * animProgress);
                ctx.font = `bold ${el.fontSize * effects.scale}px Arial`;
                ctx.fillStyle = el.color;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                const x = (el.x / 100) * w + effects.offsetX;
                const y = (el.y / 100) * h + effects.offsetY;
                
                if (el.glow) {
                    ctx.shadowColor = el.color;
                    ctx.shadowBlur = 30;
                }
                
                ctx.fillText(currentValue.toString(), x, y);
            }
            else if (el.type === 'icon') {
                const x = (el.x / 100) * w + effects.offsetX;
                const y = (el.y / 100) * h + effects.offsetY;
                const size = (el.size || 80) * effects.scale;
                
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(effects.rotation);
                
                // Draw Font Awesome icon
                ctx.font = `${size}px "Font Awesome 6 Free"`;
                ctx.fillStyle = el.color || '#667eea';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                if (el.glow) {
                    ctx.shadowColor = el.color;
                    ctx.shadowBlur = 30;
                }
                
                const iconChar = fontAwesomeIcons[el.icon] || fontAwesomeIcons['star'];
                ctx.fillText(iconChar, 0, 0);
                
                ctx.restore();
            }
            else if (el.type === 'arrow') {
                const startX = (el.startX / 100) * w;
                const startY = (el.startY / 100) * h;
                const endX = (el.endX / 100) * w;
                const endY = (el.endY / 100) * h;
                
                // Animate arrow drawing
                const currentEndX = startX + (endX - startX) * animProgress;
                const currentEndY = startY + (endY - startY) * animProgress;
                
                drawArrow(startX, startY, currentEndX, currentEndY, el.color || '#667eea', el.width || 8);
            }
            else if (el.type === 'shape') {
                const x = (el.x / 100) * w + effects.offsetX;
                const y = (el.y / 100) * h + effects.offsetY;
                const size = (el.size || 100) * effects.scale;
                
                if (el.glow) {
                    ctx.shadowColor = el.color;
                    ctx.shadowBlur = 30;
                }
                
                if (el.shape === 'circle') {
                    ctx.beginPath();
                    ctx.arc(x, y, size / 2, 0, Math.PI * 2);
                    ctx.fillStyle = el.color || '#667eea';
                    ctx.fill();
                    if (el.stroke) {
                        ctx.strokeStyle = el.strokeColor || '#fff';
                        ctx.lineWidth = el.strokeWidth || 4;
                        ctx.stroke();
                    }
                } else if (el.shape === 'rectangle') {
                    ctx.fillStyle = el.color || '#667eea';
                    ctx.fillRect(x - size/2, y - size/2, size, size);
                }
            }
            else if (el.type === 'particles') {
                // Particle effects
                const particleCount = el.count || 30;
                const baseX = (el.x / 100) * w;
                const baseY = (el.y / 100) * h;
                
                for (let i = 0; i < particleCount; i++) {
                    const angle = (i / particleCount) * Math.PI * 2;
                    const distance = animProgress * (el.distance || 150) * (0.8 + Math.random() * 0.4);
                    const particleX = baseX + Math.cos(angle) * distance;
                    const particleY = baseY + Math.sin(angle) * distance;
                    const particleSize = (el.size || 5) * (1 - animProgress * 0.5);
                    
                    ctx.beginPath();
                    ctx.arc(particleX, particleY, particleSize, 0, Math.PI * 2);
                    ctx.fillStyle = el.color || '#667eea';
                    ctx.globalAlpha = (1 - animProgress) * 0.8;
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
            }

            ctx.restore();
        }

        function calculateAnimation(animation, progress, w, h) {
            let opacity = 1;
            let offsetX = 0;
            let offsetY = 0;
            let scale = 1;
            let rotation = 0;

            if (animation === 'fade') {
                opacity = progress;
            } else if (animation === 'slideLeft') {
                offsetX = (1 - easeOutCubic(progress)) * -w;
                opacity = progress;
            } else if (animation === 'slideRight') {
                offsetX = (1 - easeOutCubic(progress)) * w;
                opacity = progress;
            } else if (animation === 'slideUp') {
                offsetY = (1 - easeOutCubic(progress)) * h;
                opacity = progress;
            } else if (animation === 'slideDown') {
                offsetY = (1 - easeOutCubic(progress)) * -h;
                opacity = progress;
            } else if (animation === 'scale') {
                scale = easeOutBack(progress);
                opacity = progress;
            } else if (animation === 'bounce') {
                const bounce = Math.abs(Math.sin(progress * Math.PI * 3)) * (1 - progress);
                offsetY = -bounce * 100;
                opacity = progress;
            } else if (animation === 'rotate') {
                rotation = progress * Math.PI * 2;
                opacity = progress;
            } else if (animation === 'pulse') {
                scale = 1 + Math.sin(progress * Math.PI * 4) * 0.1;
            } else if (animation === 'draw') {
                // For lines and paths
                opacity = 1;
            }

            return { opacity, offsetX, offsetY, scale, rotation };
        }

        function easeOutCubic(x) {
            return 1 - Math.pow(1 - x, 3);
        }

        function easeOutBack(x) {
            const c1 = 1.70158;
            const c3 = c1 + 1;
            return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
        }

        function drawArrow(fromX, fromY, toX, toY, color, width) {
            const headLength = width * 4;
            const angle = Math.atan2(toY - fromY, toX - fromX);
            
            // Draw line
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.lineCap = 'round';
            ctx.shadowColor = color;
            ctx.shadowBlur = 15;
            
            ctx.beginPath();
            ctx.moveTo(fromX, fromY);
            ctx.lineTo(toX, toY);
            ctx.stroke();
            
            // Draw arrowhead
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(toX, toY);
            ctx.lineTo(
                toX - headLength * Math.cos(angle - Math.PI / 6),
                toY - headLength * Math.sin(angle - Math.PI / 6)
            );
            ctx.lineTo(
                toX - headLength * Math.cos(angle + Math.PI / 6),
                toY - headLength * Math.sin(angle + Math.PI / 6)
            );
            ctx.closePath();
            ctx.fill();
            
            ctx.shadowBlur = 0;
        }

        function replayAnimation() {
            if (currentAnimation) {
                renderAnimation(currentAnimation);
            }
        }

        exportBtn.addEventListener('click', () => {
            if (animationFrames.length === 0) return;
            
            // Download first, middle and last frame
            downloadFrame(animationFrames[0], 'frame-start.png');
            setTimeout(() => {
                const midFrame = Math.floor(animationFrames.length / 2);
                downloadFrame(animationFrames[midFrame], 'frame-middle.png');
            }, 500);
            setTimeout(() => {
